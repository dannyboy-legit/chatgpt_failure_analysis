name: Controller self-tests
on:
  push:
    paths:
      - 'controller/**'
      - '.github/workflows/controller-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic controller tests
        working-directory: controller
        run: python -m unittest -v test_controller.py
