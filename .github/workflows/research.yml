name: Failure Analysis Worker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run four-pass analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/research.py
      - name: Commit worker result
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name 'failure-analysis-bot'
            git config user.email 'failure-analysis-bot@users.noreply.github.com'
            git add runs/
            git commit -m "Automated research run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          else
            echo 'No worker output to commit.'
          fi
