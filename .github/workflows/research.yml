name: Failure Analysis Source Collector

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect fresh research candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_sources.py
      - name: Commit source queue
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name 'failure-analysis-bot'
            git config user.email 'failure-analysis-bot@users.noreply.github.com'
            git add source_queue/
            git commit -m "Collect failure-analysis sources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          else
            echo 'No source collection output to commit.'
          fi
